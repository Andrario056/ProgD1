<!doctype html>
<!--
	MOCKUP ESTÁTICO · Registrar paciente (rol Médico)
	Página real equivalente: src/pages/medico/medico-paciente.jsx
	------------------------------------------------------------------
	Qué muestra: formulario con la ficha completa del paciente (datos
	personales, contacto, región, tipo de sangre y alergias). Es solo
	maqueta: el botón "Guardar paciente" no procesa nada.
	Maqueta HTML/CSS del sistema (sin lógica de negocio): daisyUI 5 +
	Tailwind v4 + Tabler Icons desde ../vendor/, tema "salud" en
	../estilos.css y datos escritos a mano equivalentes a
	src/data/data-frontend.js. Ver Pro2/index.html para el detalle
	general de la carpeta.
-->
<html lang="es" data-theme="salud">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Registro de pacientes — Centro de Vacunación Salud</title>
		<!-- Recursos locales (sin CDN ni internet): se generan con
		`pnpm install` en esta carpeta (scripts/preparar-assets.mjs) -->
		<link href="../vendor/inter/index.css" rel="stylesheet" />
		<link href="../vendor/tabler/tabler-icons.min.css" rel="stylesheet" />
		<link href="../vendor/daisyui/daisyui.css" rel="stylesheet" />
		<link href="../estilos.css" rel="stylesheet" />
		<script src="../vendor/tailwind/index.global.js"></script>
	</head>
	<body>
		<div class="drawer lg:drawer-open">
			<input id="menu-principal" type="checkbox" class="drawer-toggle" />
			<div class="drawer-content flex min-h-svh flex-col bg-base-200">
				<!-- Barra superior: botón de menú (móvil), logo, rol conectado y salir -->
				<div class="navbar sticky top-0 z-10 border-base-300 border-b bg-base-100">
					<div class="navbar-start gap-2">
						<label
							for="menu-principal"
							class="btn btn-ghost btn-square drawer-button lg:hidden"
							aria-label="Abrir menú"
						>
							<i class="ti ti-menu-2 text-[22px]"></i>
						</label>
						<span class="flex items-center gap-2 font-semibold">
							<i class="ti ti-vaccine text-[24px] text-primary"></i>
							<span class="hidden sm:inline">
								Centro de Vacunación Salud
							</span>
						</span>
					</div>
					<div class="navbar-end gap-3">
						<span class="hidden text-right text-xs sm:block">
							<span class="block font-medium">Médico</span>
						</span>
						<a href="../index.html" class="btn btn-outline btn-sm">
							<i class="ti ti-logout text-[18px]"></i>
							Salir
						</a>
					</div>
				</div>
				<main class="mx-auto w-full max-w-6xl flex-1 p-4 sm:p-6">
					<div class="flex flex-col gap-6">
						<header>
							<h1 class="font-bold text-2xl">
								Registro de pacientes
							</h1>
							<p class="text-sm opacity-70">
								Creación de cuenta y ficha para las personas que
								llegan a atenderse a la clínica.
							</p>
						</header>

						<!-- Formulario de ficha del paciente (maqueta: no guarda datos) -->
						<form class="card bg-base-100 shadow-sm">
							<div class="card-body grid gap-4 sm:grid-cols-2">
								<div class="flex flex-col gap-1 sm:col-span-2">
									<label class="label" for="nombre">
										Nombre completo
									</label>
									<input
										id="nombre"
										type="text"
										class="input w-full"
										placeholder="Ana Torres"
										required
									/>
								</div>

								<div class="flex flex-col gap-1">
									<label class="label" for="cedula">
										Cédula
									</label>
									<input
										id="cedula"
										type="text"
										class="input w-full"
										placeholder="V-00000000"
										required
									/>
								</div>

								<div class="flex flex-col gap-1">
									<label class="label" for="fechaNacimiento">
										Fecha de nacimiento
									</label>
									<input
										id="fechaNacimiento"
										type="date"
										class="input w-full"
										required
									/>
								</div>

								<div class="flex flex-col gap-1">
									<label class="label" for="sexo">Sexo</label>
									<select
										id="sexo"
										class="select w-full"
									>
										<option>Femenino</option>
										<option>Masculino</option>
										<option>Otro</option>
									</select>
								</div>

								<div class="flex flex-col gap-1">
									<label class="label" for="telefono">
										Teléfono
									</label>
									<input
										id="telefono"
										type="tel"
										class="input w-full"
										placeholder="0414-0000000"
									/>
								</div>

								<div class="flex flex-col gap-1">
									<label class="label" for="email">
										Correo electrónico
									</label>
									<input
										id="email"
										type="email"
										class="input w-full"
										placeholder="correo@ejemplo.com"
									/>
								</div>

								<div class="flex flex-col gap-1">
									<label class="label" for="region">
										Región
									</label>
									<select id="region" class="select w-full">
										<option>Capital</option>
										<option>Zona Norte</option>
										<option>Zona Sur</option>
										<option>Zona Este</option>
										<option>Zona Oeste</option>
									</select>
								</div>

								<div class="flex flex-col gap-1 sm:col-span-2">
									<label class="label" for="direccion">
										Dirección
									</label>
									<input
										id="direccion"
										type="text"
										class="input w-full"
										placeholder="Av. Libertador, Caracas"
									/>
								</div>

								<div class="flex flex-col gap-1">
									<label class="label" for="tipoSangre">
										Tipo de sangre
									</label>
									<input
										id="tipoSangre"
										type="text"
										class="input w-full"
										placeholder="O+"
									/>
								</div>

								<div class="flex flex-col gap-1">
									<label class="label" for="alergias">
										Alergias
									</label>
									<input
										id="alergias"
										type="text"
										class="input w-full"
										placeholder="Ninguna"
									/>
								</div>

								<div class="sm:col-span-2">
									<button type="button" class="btn btn-primary">
										Guardar paciente
									</button>
								</div>
							</div>
						</form>
					</div>
				</main>
			</div>
			<!-- Menú lateral (drawer de daisyUI): navegación del rol Médico -->
			<div class="drawer-side z-20">
				<label
					for="menu-principal"
					aria-label="Cerrar menú"
					class="drawer-overlay"
				></label>
				<aside class="flex min-h-full w-72 flex-col bg-base-100">
					<div class="border-base-300 border-b p-4">
						<p class="font-semibold">Menú</p>
						<p class="text-xs opacity-60">Médico</p>
					</div>
					<ul class="menu w-full flex-1 p-3">
						<li>
							<a href="index.html">
								<i class="ti ti-layout-dashboard text-[20px]"></i>
								Panel de atención
							</a>
						</li>
						<li>
							<a href="pacientes.html" class="menu-active">
								<i class="ti ti-user-plus text-[20px]"></i>
								Registrar paciente
							</a>
						</li>
						<li>
							<a href="consulta.html">
								<i class="ti ti-user-search text-[20px]"></i>
								Consultar perfil
							</a>
						</li>
						<li>
							<a href="vacunas.html">
								<i class="ti ti-clipboard-plus text-[20px]"></i>
								Registrar vacuna
							</a>
						</li>
					</ul>
				</aside>
			</div>
		</div>
	</body>
</html>
