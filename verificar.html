							</span>

							</span>

			<main class="mx-auto w-full max-w-4xl px-4 py-8 sm:px-6 sm:py-10">
				<div class="flex flex-col gap-4">
					<header>
						<h1 class="font-semibold text-2xl tracking-tight sm:text-3xl">Verificar un certificado médico</h1>
						<p class="mt-2 text-base text-base-content/65">Escribe el código único que aparece en el certificado o la cédula del usuario para comprobar su validez, vigencia, sello y firma digital.</p>
					</header>

					<section class="rounded-2xl bg-base-100 p-4 shadow-sm ring-1 ring-base-300/50 sm:p-5">
						<form data-form-verificar class="flex flex-col gap-3 sm:flex-row sm:items-end">
							<div class="flex min-w-0 flex-1 flex-col gap-1.5">
								<label for="verificarCodigo" class="font-medium text-sm">Código o cédula del certificado</label>
								<input id="verificarCodigo" type="search" class="input h-10 w-full rounded-xl font-mono uppercase" data-verificar-codigo placeholder="CERT-2026-0001 o V-10234567" autocomplete="off" />
							</div>
							<div class="flex gap-2">
								<button type="submit" class="btn btn-primary min-h-10 rounded-xl">
									<span class="icono icono-search size-[18px]" aria-hidden="true"></span>
									Verificar
								</button>
								<button type="button" class="btn btn-outline min-h-10 rounded-xl" data-verificar-limpiar hidden>Limpiar</button>
							</div>
						</form>
						<div class="mt-4" data-verificar-alerta></div>
						<p class="mt-4 text-base-content/50 text-xs">Códigos de demostración: CERT-2026-0002, CERT-2026-0001 y CERT-2025-0001.</p>
					</section>

					<div data-verificar-resultado class="flex flex-col gap-5"></div>
				</div>
			</main>
